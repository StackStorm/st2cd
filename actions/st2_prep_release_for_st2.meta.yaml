---
name: st2_prep_release_for_st2
description: Prepare the st2 repo for release
enabled: true
runner_type: remote-shell-script
entry_point: st2_prep_release_for_st2.sh
parameters:
    # This is the github repository name.
    project:
        type: string
        description: Project name for st2
        default: st2
        position: 0
    version:
        type: string
        description: Version to use for the release. Should include the patch e.g. 0.1.0
        required: true
        position: 1
    # Name of the owner of the github repository. a.k.a. github organisation.
    fork:
        type: string
        description: Fork to use
        default: StackStorm
        position: 2
    local_repo:
        type: string
        description: Location where to clone the repo. Programmatically determined if not provided.
        position: 3
    dir:
        immutable: true
        default: /home/stanley/
    sudo:
        immutable: true
        default: false
    cmd:
        immutable: true
        default: ""
    kwarg_op:
        immutable: true
        default: "--"
