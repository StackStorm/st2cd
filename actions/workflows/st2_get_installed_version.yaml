---
version: '1.0'

input:
  - host
  - packages


vars:
  - distro: indeterminate
  - versions: indeterminate


tasks:
  get_distro:
    action: st2cd.get_distro
    input:
      hosts: <% ctx().host %>
    next:
      - when: <% succeeded() %>
        do: get_package_versions
        publish:
          - distro: <% result().get(ctx().host).stdout %>

  get_package_versions:
    with:
      items: <% ctx().packages %>
      concurrency: <% ctx().packages.count() %>
    action: core.remote_sudo
    input:
      hosts: <% ctx().host %>
      cmd: |
        export PM=$(command -v apt-cache)
        test -z "$PM" && PM=$(command -v dnf)
        case "$PM" in
          *apt-cache)
            apt-cache policy <% item() %> | awk '/Installed: [0-9]/ {print $2}'
            ;;
          *dnf)
            dnf list installed <% item() %> | awk '/<% item() %>/ {print $2}'
            ;;
          *)
            echo "apt-cache or dnf package manager weren't found on this host!" >&2
            exit 1
            ;;
        esac
    next:
      - when: <% succeeded() %>
        publish:
          - result: <% result() %>


output:
  - distro: <% str(ctx().distro) %>
  - versions: <% dict(ctx().packages.zip(ctx().result.select($.values().first().get(stdout)))) %>
