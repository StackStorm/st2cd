---
version: '1.0'
description: Prepare st2 for release.

input:
  - version
  - fork
  - host
  - cwd

vars:
  - local_repo_sfx: <% "".join([now().format("%s"), "_", random(100,1000)]) %>

tasks:
  init:
    action: core.noop
    next:
      - do: get_host
        when: <% (ctx(host) = null) %>
      - do: prep_st2
        when: <% (ctx().host != null) %>

  get_host:
    action: linux.dig
    input:
      hostname: st2-build-slave-ubuntu.service.consul
      rand: true
      count: 1
    next:
      - do: prep_st2
        when: <% succeeded() %>
        publish:
          - host: <% result().result[0] %>

  prep_st2:
    action: st2cd.st2_prep_release_for_st2
    input:
      project: st2
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_st2docs
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_st2docs:
    action: st2cd.st2_prep_release_for_st2docs
    input:
      project: st2docs
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2docs_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_st2tests
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_st2tests:
    action: st2cd.st2_prep_release_for_st2tests
    input:
      project: st2tests
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2tests_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_st2web
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_st2web:
    action: st2cd.st2_prep_release_for_gui
    input:
      project: st2web
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2web_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_st2chatops
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_st2chatops:
    action: st2cd.st2_prep_release_for_gui
    input:
      project: st2chatops
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2chatops_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_ldap_backend
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_ldap_backend:
    action: st2cd.st2_prep_release_for_ldap_backend
    input:
      project: st2-auth-ldap
      version: <% ctx().version %>
      fork: StackStorm
      local_repo: <% 'st2_auth_ldap_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_rbac_backend
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_rbac_backend:
    action: st2cd.st2_prep_release_for_rbac_backend
    input:
      project: st2-rbac-backend
      version: <% ctx().version %>
      fork: StackStorm
      local_repo: <% 'st2_rbac_backend_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: prep_st2_pkg
        when: <% succeeded() %>
      - do: cleanup_on_failure
        when: <% failed() %>

  prep_st2_pkg:
    action: st2cd.st2_prep_release_for_st2_pkg
    input:
      project: st2-packages
      version: <% ctx().version %>
      fork: <% ctx().fork %>
      local_repo: <% 'st2_packages_' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
      cwd: <% ctx().cwd %>
    next:
      - do: cleanup_on_failure
        when: <% failed() %>


  cleanup_on_failure:
    action: core.noop
    next:
      - do: cleanup
        when: <% ctx().local_repo_sfx %>
      - do: fail
        when: <% not ctx().local_repo_sfx %>

  cleanup:
    action: core.remote
    input:
      cmd: <% 'rm -rf ' + ctx().cwd + '/st2*' + ctx().local_repo_sfx %>
      hosts: <% ctx().host %>
    next:
      - do: fail
