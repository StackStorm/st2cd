---
pack: "st2cd"
name: "slack_notify"
enabled: true
description: "Notification rule to send messages to Slack"
trigger:
  pack: "chatops"
  type: "core.st2.generic.notifytrigger"
criteria:
  trigger.route:
    pattern: "slack"
    type: "equals"
action:
  ref: chatops.post_message
  parameters:
    route: errbot
    channel: "#thunderdome"
    message: "{{ trigger.execution_id }}: {{ trigger.message }}"
