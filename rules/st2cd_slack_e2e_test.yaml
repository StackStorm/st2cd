---
  pack: "st2cd"
  name: "st2cd_slack_e2e_test"
  description: "Post results of st2cd workflows to slack"
  enabled: true
  trigger:
    type: "core.st2.generic.actiontrigger"
  criteria:
    trigger.action_name:
      pattern: "st2cd.e2e_tests"
      type: "equals"
  action:
    ref: chatops.post_message"
    parameters:
      route: errbot
      channel: "{% if trigger.status == 'succeeded' %}#thunderdome{% else %}#opstown{% endif %}"
      text: |
        ```[{{ trigger.action_name}} - {{ trigger.parameters.environment }}: {{ trigger.status.upper() }}]
        HOST: {{ trigger.parameters.hostname }}
        BRANCH: {{ trigger.parameters.branch }}
        SHA: {{ trigger.parameters.revision }}
        BUILD: {{ trigger.parameters.build }}```
