---
  pack: "st2cd"
  name: "st2cd_slack_github_push_master"
  description: "Post to Slack on matching GitHub event"
  enabled: true
  trigger:
    type: "githubwebhook.github_event"
  criteria:
    trigger.body.ref:
      pattern: "refs/heads/master"
      type: "equals"
    trigger.body.repository.full_name:
      pattern: "StackStorm/st2"
      type: "equals"
  action:
    ref: chatops.post_message
    parameters:
      channel: "#thunderdome"
      route: errbot
      message: |
        ```[GITHUB - {{ trigger.body.repository.full_name }}: {{ trigger.body.ref.split('/')[-1] }}]
        PUSHER: {{ trigger.body.pusher.name }}
        MSG: {{ trigger.body.head_commit.message }}```
