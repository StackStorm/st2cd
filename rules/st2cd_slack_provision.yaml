---
  pack: "st2cd"
  name: "st2cd_slack_provision"
  description: "Post to slack on provisioning"
  enabled: false
  trigger:
    type: "core.st2.generic.actiontrigger"
  criteria:
    trigger.action_name:
      pattern: "st2cd.create_vm_role"
      type: "equals"
  action:
    ref: chatops.post_message
    parameters:
      channel: "#opstown"
      route: errbot
      message: |
        {% if trigger.status != 'succeeded' -%}
        *[{{ trigger.status.upper() }}]*
        {% else -%}
        [{{ trigger.status.upper() }}]
        {% endif %}
        {{ trigger.parameters.hostname }} was {% if trigger.status != 'succeeded' %}*NOT*{% endif %} created with role {{ trigger.parameters.role }} in {{ trigger.parameters.environment }}
