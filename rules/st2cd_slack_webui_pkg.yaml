---
  pack: "st2cd"
  name: "st2cd_slack_webui_pkg"
  description: "Post results of webui_packaging workflow to slack"
  enabled: true
  trigger:
    type: "core.st2.generic.actiontrigger"
  criteria:
    trigger.action_name:
      pattern: "st2cd.webui_pkg"
      type: "equals"
  action:
    ref: chatops.post_message
    parameters:
      route: errbot
      channel: "#development"
      message: |
        ```[{{ trigger.action_name }} - {{ trigger.parameters.environment }}: {{ trigger.status.upper() }}]
        DL_HOST: {{ trigger.parameters.dl_server }
        BRANCH: {{ trigger.parameters.branch }}
        BUILD: {{ trigger.parameters.build }}```
